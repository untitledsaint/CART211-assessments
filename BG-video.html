<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background video</title>

    <style>
        * {
            margin: 0;
            padding:0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;
            background-color: black;
        }
        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            /* fills the screen without stretching the video */
            object-fit: cover; 
            object-position: center;

            /* places the video behind the content */
            z-index: -1;

            
        }
            .overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;

                background-color: rgba(0, 0, 0, 0.4);
                z-index: 0;
            }

                .content {
                    position: relative;
                    z-index: 1;
                    min-height: 100vh;
                    display: flex;
                    flex-direction: column;
                    /*centers content vertically */
                     justify-content: center; 
                     /*centers content horizontally */
                    align-items: center;
                    padding: 20px;

                }
                /* Clamp function takes 3 values - (clamp(min, pref, max)) */
                /* rem is a unit based on the root font size of the webpage */
                h1{
                    font-size: clamp(2rem, 5w, 4rem);
                    margin-bottom: 15px;
                }
            

            p {
                font-size: 1.2rem;
            }
        

    </style>

</head>

<body>
   <video class="background-video"
   autoplay
   muted
   loop
   playsinline
   aria-hidden="true"
   tabindex="-1">

   <source src="videoflowers.mp4" type="video/mp4">
   your browser does not support background video
</video>
<!-- darkens the bg video so the text is readable -->
<div class="overlay"></div>
<main class="content">
    <h1>flowers</h1>
    <p>flowers are flowering</p>
</main>

</body>

</html>
